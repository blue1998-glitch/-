name: Daily Ranking
on:
  schedule:
    - cron: '30 6 * * 1-5' # 台灣時間週一至週五 14:30 自動執行
  workflow_dispatch: # 允許隨時手動點擊執行

jobs:
  run-ranker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run ranking script
        run: python rank_all.py

      - name: Auto commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update full market rankings [skip ci]"
          file_pattern: "market_rankings.json"
